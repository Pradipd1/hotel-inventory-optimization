# Render Blueprint for the API (Express + MongoDB Atlas).
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is created.
services:
  - type: web
    name: hotel-inventory-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: ALERT_SCAN_INTERVAL_MINUTES
        value: "60"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
